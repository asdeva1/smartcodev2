name: CI

# Quality gate for every pull request and push to develop/main (docs/13-testing-strategy.md §4).
# Synthetic data only (D-05). No AWS credentials are used here.

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  APP_ENV: test
  # CI must run the PostgreSQL integration tests — a missing database fails the build instead of skipping.
  REQUIRE_DATABASE_TESTS: '1'
  # Ephemeral CI database: trust auth inside the job's private network, so no password exists anywhere.
  DATABASE_URL: postgresql://postgres@localhost:5432/smartcode_ci

jobs:
  verify:
    name: Lint, typecheck, test, build, database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: smartcode_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Secret scan
        run: pnpm secrets:check

      - name: Apply migrations to an empty database
        run: pnpm db:migrate
      - name: Migration status (clean, nothing pending)
        working-directory: apps/api
        run: pnpm exec prisma migrate status
      - name: Schema drift check (migrations must match schema.prisma exactly)
        working-directory: apps/api
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: System seed (twice — must be idempotent)
        run: pnpm db:seed && pnpm db:seed
      - name: Database health and verification
        run: pnpm db:health && pnpm db:verify
      - name: Reset and recreate from migrations (local-only command, test env)
        run: pnpm db:reset && pnpm db:verify

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: CDK synth (staging, production)
        working-directory: infra/cdk
        run: pnpm synth:staging && pnpm synth:production

  e2e:
    name: End-to-end (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: smartcode_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:4000
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Emails go to files so the tests can open the activation / reset links (stand-in for Mailpit).
      MAIL_TRANSPORT: file
      MAIL_FILE_DIR: ${{ github.workspace }}/.e2e-mail
      E2E_MAIL_DIR: ${{ github.workspace }}/.e2e-mail
      E2E_MANAGER_EMAIL: e2e.manager@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartcode/e2e install:browsers
      - run: pnpm db:generate && pnpm db:migrate && pnpm db:seed
      - name: Bootstrap the first Manager through the activation workflow (no password exists anywhere)
        shell: bash
        run: |
          set -o pipefail
          pnpm bootstrap:manager 2>&1 | tee bootstrap.log || { tail -n 15 bootstrap.log | while IFS= read -r l; do echo "::error::${l}"; done; exit 1; }
        env:
          BOOTSTRAP_MANAGER_EMAIL: e2e.manager@example.test
          BOOTSTRAP_MANAGER_NAME: E2E Manager
          BOOTSTRAP_MANAGER_EMPLOYEE_ID: MGR-E2E
      - run: pnpm build
      - name: Run E2E against the built API and web app
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee e2e.log || { grep -E 'Error|Expected|Received|✘|failed|Timeout' e2e.log | head -n 20 | while IFS= read -r l; do echo "::error::${l}"; done; exit 1; }
        env:
          E2E_START_SERVERS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

  docker:
    name: API container image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime and migrator images
        run: |
          docker build -f apps/api/Dockerfile --target runtime -t smartcode-api:ci .
          docker build -f apps/api/Dockerfile --target migrator -t smartcode-api:ci-migrator .
      - name: Container starts and reports liveness (non-root)
        run: |
          docker run -d --name api -p 4000:4000 -e APP_ENV=test smartcode-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:4000/health/live && break; sleep 1; done
          test "$(docker exec api id -u)" != "0"
          docker logs api | tail -20

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
