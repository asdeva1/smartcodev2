name: Security

# Dependency audit, secret scan and container scan (docs/security-review.md). Synthetic data only; no AWS credentials.

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Audit, secrets, container scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (production dependencies, high and above)
        run: pnpm audit --prod --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image
        run: docker build -f apps/api/Dockerfile --target runtime -t smartcode-api:scan .
      - name: Scan image (fixable HIGH/CRITICAL findings fail the build)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: smartcode-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
